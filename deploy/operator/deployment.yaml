apiVersion: apps/v1
kind: Deployment
metadata:
  name: vcenteremu
  labels:
    app: vcenteremu
    app.kubernetes.io/name: vcenteremu
    app.kubernetes.io/managed-by: alfslab-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vcenteremu
  template:
    metadata:
      labels:
        app: vcenteremu
    spec:
      # Kubernetes service-link variables use the service name as their prefix.
      # A service named "vcenteremu" would otherwise inject VCENTEREMU_PORT as
      # a tcp:// URL and override the application's integer port setting.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: quay.io/abach/vcenteremu:latest
          imagePullPolicy: Always
          env:
            - name: VCENTEREMU_HOST
              value: "0.0.0.0"
            - name: VCENTEREMU_PORT
              value: "8181"
            - name: VCENTEREMU_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vcenteremu-secret
                  key: VCENTEREMU_API_PASSWORD
          ports:
            - name: http
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
